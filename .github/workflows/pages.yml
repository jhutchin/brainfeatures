name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node tests/test_sim.js
      - name: Assemble site
        run: python3 build/make_site.py _site
      - name: Fetch film and feature data (release assets, checksummed)
        run: python3 build/fetch_assets.py _site
      - name: Page 3 film design (from page 2's payload)
        run: python3 build/film_design.py _site
      - name: Film-mode tests
        run: node tests/test_film.js _site
      - name: Credits check
        run: python3 tests/check_credits.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
